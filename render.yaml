services:
  - type: web
    name: dbot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python rag/build_index.py
    startCommand: gunicorn --timeout 120 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: RAG_ENABLED
        value: "false"
